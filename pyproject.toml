[project]
name = "anonymizer-sk"
version = "0.1.0"
description = "Anonymizácia a pseudonymizácia osobných údajov v slovenských dokumentoch (TXT, DOCX, PDF, skeny, EML)"
requires-python = ">=3.10"
dependencies = [
  "presidio-analyzer>=2.2.360", "spacy>=3.7", "pdfplumber>=0.11", "pypdf>=4.0", "pdf2image>=1.17",
  "pytesseract>=0.3.10", "Pillow>=10.0", "lxml>=5.0", "cryptography>=42.0", "PyYAML>=6.0",
]

[project.optional-dependencies]
ner = ["transformers>=4.40", "torch>=2.2"]
dev = ["python-docx>=1.1", "reportlab>=4.0", "pytest"]

[project.scripts]
anonymizer-sk = "anonymizer_sk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["anonymizer_sk", "anonymizer_sk.handlers"]
